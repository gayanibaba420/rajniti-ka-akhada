<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#A71D2A" />
  <title>ऑफ़लाइन | राजनीति का अखाड़ा</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: system-ui, sans-serif;
      background: #f7f4ee;
      color: #171717;
      text-align: center;
    }
    .card {
      max-width: 22rem;
      padding: 2rem 1.5rem;
      border-radius: 1rem;
      background: #fffdf9;
      border: 1px solid #ded8cf;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.25rem;
      color: #a71d2a;
    }
    p {
      margin: 0 0 1.25rem;
      line-height: 1.6;
      color: #69645d;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 0.75rem 1.25rem;
      background: #a71d2a;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    button:active { background: #73101a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>आप ऑफ़लाइन हैं</h1>
    <p>इंटरनेट कनेक्शन नहीं मिल रहा। कृपया नेटवर्क जांचें और दोबारा कोशिश करें।</p>
    <button type="button" onclick="location.reload()">पुनः प्रयास करें</button>
  </div>
</body>
</html>
